[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "logharbor"
version = "0.1.0"
description = "Your logs and traces, searchable, on your own PC: file following, OTLP JSON receiver, local web UI."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
logharbor = "logharbor.cli:main"

[tool.setuptools]
packages = ["logharbor"]

[tool.setuptools.package-data]
logharbor = ["ui.html"]
